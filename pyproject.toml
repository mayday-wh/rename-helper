[project]
name = "rename"
version = "1.2.0"
description = "A small UI tool for batch renaming files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rename = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
